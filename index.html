<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>qrfile — hand files from your AI to your phone</title>
<meta name="description" content="qrfile is an MCP server + Android app that moves files between your computer and your phone over your own Wi-Fi. No cables, no cloud, no accounts. Scroll the intro, then install." />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230f1a2e'/%3E%3Cg fill='%2322d3ee'%3E%3Crect x='6' y='6' width='7' height='7' rx='1'/%3E%3Crect x='19' y='6' width='7' height='7' rx='1'/%3E%3Crect x='6' y='19' width='7' height='7' rx='1'/%3E%3Crect x='19' y='19' width='2.5' height='2.5'/%3E%3Crect x='23.5' y='19' width='2.5' height='2.5'/%3E%3Crect x='19' y='23.5' width='2.5' height='2.5'/%3E%3Crect x='23.5' y='23.5' width='2.5' height='2.5'/%3E%3C/g%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ===== the scroll story: a sticky full-viewport stage you scrub by scrolling ===== -->
<main id="top">
  <div class="film-track" id="filmTrack">
    <div class="film-sticky" id="player">
      <canvas id="stage" aria-label="qrfile scroll story"></canvas>

      <div class="chapter-layer" id="chapterLayer"><!-- chapter copy injected by js --></div>

      <!-- clickable cards on the site that lives inside the monitor (final chapter) -->
      <a class="screen-hotspot" id="spotApk" href="https://hkturtco.github.io/app-debug.apk" download hidden>
        <span class="spot-tag">android app</span>
        <span class="spot-label">⬇&nbsp; app-debug.apk</span>
      </a>
      <a class="screen-hotspot" id="spotPip" href="https://pypi.org/project/qrfile-mcp" target="_blank" rel="noopener" hidden>
        <span class="spot-tag">mcp server</span>
        <span class="spot-label">pip install qrfile-mcp ↗</span>
      </a>

      <div class="scanner-flash" id="scannerFlash"></div>
      <div class="rail" id="rail" role="navigation" aria-label="film chapters"></div>
      <div class="scroll-hint" id="scrollHint"><span class="hint-hover">scroll ⌄</span><span class="hint-touch">swipe ⌄</span></div>
    </div>
  </div>

</main>

<script src="js/three.min.js"></script>
<script src="js/video.js?v=14"></script>
<script src="js/site.js"></script>
</body>
</html>
